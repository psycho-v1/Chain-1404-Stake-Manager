<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Chain-1404 Stake Manager — unofficial community BDAG staking UI.">
  <title>Claim · Chain-1404 Stake Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-page="claim">
  <div id="shell"></div>
  <main class="container-xl py-4">
    <div class="glass p-4">
      <h1 class="h3">Claim</h1>
      <p class="text-secondary">Use when rewards or a finished unstake are ready.</p>
      <p id="detail" class="small text-secondary"></p>
      <p>Rewards: <strong id="rew">—</strong> · Unbonding: <strong id="unbond">—</strong></p>
      <p class="small" id="firstStake"></p>
      <label class="form-label" for="pool">Mining pool address</label>
      <input class="form-control" id="pool" placeholder="0x…" autocomplete="off" spellcheck="false">
      <button type="button" class="btn btn-accent mt-3" id="btnClaim" data-need-ready>Claim</button>
    </div>
  </main>
  <footer class="site container-xl pb-3" id="foot"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/pins.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
