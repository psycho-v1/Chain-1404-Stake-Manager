<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Chain-1404 Stake Manager — unofficial community BDAG staking UI.">
  <title>Stake · Chain-1404 Stake Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-page="stake">
  <div id="shell"></div>
  <main class="container-xl py-4">
    <div class="glass p-4">
      <h1 class="h3">Stake BDAG</h1>
      <p class="text-secondary">You lock this BDAG. Unstake is not same-day.</p>
      <p id="detail" class="small text-secondary"></p>
      <p>In wallet: <strong id="bal">—</strong> BDAG</p>
      <label class="form-label" for="pool">Mining pool address</label>
      <input class="form-control mb-3" id="pool" placeholder="0x…" autocomplete="off" spellcheck="false">
      <label class="form-label" for="amount">How much BDAG?</label>
      <input class="form-control" id="amount" inputmode="decimal" placeholder="0.0">
      <div class="d-flex flex-wrap gap-2 mt-3">
        <button type="button" class="btn btn-ghost" id="btnMax">Max</button>
        <button type="button" class="btn btn-accent" id="btnStake" data-need-ready>Stake</button>
      </div>
      <p class="small text-secondary mt-3" id="firstStake">Minimum 0.001 BDAG. Adding more while unstaking can restart the wait.</p>
    </div>
  </main>
  <footer class="site container-xl pb-3" id="foot"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/pins.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
