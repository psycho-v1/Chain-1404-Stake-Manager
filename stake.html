<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Chain-1404 Stake Manager — unofficial community BDAG staking UI.">
  <title>Stake · Chain-1404 Stake Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css?v=20260911c">
</head>
<body data-page="stake">
  <div id="shell"></div>
  <main class="container-xl py-4">
    <div class="glass p-4">
      <h1 class="h3">Stake BDAG</h1>
      <p class="text-secondary">You stake this BDAG. Unstake is not same-day.</p>
      <p id="detail" class="small text-secondary"></p>
      <p>In wallet: <strong id="bal">—</strong> BDAG</p>
      <p class="small" id="lockedLine"></p>
      <p class="small mb-2 d-none" id="poolHealth"></p>

      <div class="input-group mb-3">
        <input class="form-control" id="contractQuery" placeholder="Position 0x (optional search)" autocomplete="off" spellcheck="false">
        <button class="btn btn-accent" type="button" id="btnSearchContracts">Search</button>
      </div>
      <div id="contractHits"></div>
      <label class="form-label" for="amount">How much BDAG?</label>
      <input class="form-control" id="amount" inputmode="decimal" placeholder="0.0">
      <div class="d-flex flex-wrap gap-2 mt-3">
        <button type="button" class="btn btn-ghost" id="btnMax">Max</button>
        <button type="button" class="btn btn-accent" id="btnStake">Stake</button>
      </div>
      <p class="small text-secondary mt-3" id="firstStake">Minimum 0.001 BDAG. Adding more while unstaking can restart the wait.</p>
      <div class="wait-card mt-3" id="waitCard">
        <div class="d-flex justify-content-between small mb-1">
          <span id="waitLabel">Wait</span>
          <span id="waitClock">—</span>
        </div>
        <div class="wait-track"><div class="wait-fill" id="waitFill"></div></div>
        <p class="small text-secondary mb-0 mt-2" id="waitHint"></p>
      </div>
    </div>
  </main>
  <footer class="site container-xl pb-3" id="foot"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/pins.js?v=20260911c"></script>
  <script src="js/audit.js?v=20260911c"></script>
  <script src="js/app.js?v=20260911c"></script>
</body>
</html>
