<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Chain-1404 Stake Manager — unofficial community BDAG staking UI.">
  <title>Activity · Chain-1404 Stake Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-page="log">
  <div id="shell"></div>
  <main class="container-xl py-4">
    <div class="glass p-4">
      <div class="d-flex justify-content-between flex-wrap gap-2">
        <h1 class="h3">Activity log</h1>
        <button type="button" class="btn btn-ghost" id="btnClear">Clear this device</button>
      </div>
      <p class="text-secondary">Saved in this browser only. Not a chain-wide statement.</p>
      <div class="table-responsive">
        <table class="table table-sm">
          <thead><tr><th>When</th><th>Action</th><th>Amount</th><th>Status</th><th>Details</th></tr></thead>
          <tbody id="logBody"></tbody>
        </table>
      </div>
    </div>
  </main>
  <footer class="site container-xl pb-3" id="foot"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/pins.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
