<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Chain-1404 Stake Manager — unofficial community BDAG staking UI.">
  <title>Unstake · Chain-1404 Stake Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-page="unstake">
  <div id="shell"></div>
  <main class="container-xl py-4">
    <div class="glass p-4">
      <h1 class="h3">Unstake BDAG</h1>
      <p class="text-secondary">About three weeks locked, then claim it out.</p>
      <p id="detail" class="small text-secondary"></p>
      <p>Staked now: <strong id="staked">—</strong> BDAG</p>
      <p class="small" id="firstStake"></p>
      <p class="small" id="epochLine"></p>
      <label class="form-label" for="pool">Mining pool address</label>
      <input class="form-control mb-3" id="pool" placeholder="0x…" autocomplete="off" spellcheck="false">
      <label class="form-label" for="amount">How much to unstake?</label>
      <input class="form-control" id="amount" inputmode="decimal" placeholder="0.0">
      <button type="button" class="btn btn-accent mt-3" id="btnUnstake" data-need-ready>Request unstake</button>
      <h2 class="h6 mt-4">Open requests</h2>
      <ul id="unbondList"><li>Connect from the header to load.</li></ul>
    </div>
  </main>
  <footer class="site container-xl pb-3" id="foot"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/pins.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
