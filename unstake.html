<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Chain-1404 Stake Manager — unofficial community BDAG staking UI.">
  <title>Unstake · Chain-1404 Stake Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-page="unstake">
  <div id="shell"></div>
  <main class="container-xl py-4">
    <div class="glass p-4">
      <h1 class="h3">Unstake BDAG</h1>
      <p class="text-secondary">About three weeks locked, then claim it out.</p>
      <p id="detail" class="small text-secondary"></p>
      <p>Staked now: <strong id="staked">—</strong> BDAG</p>
      <p class="small" id="firstStake"></p>
      <p class="small" id="epochLine"></p>
      <p class="small" id="lockedLine"></p>
      <div class="input-group mb-3">
        <input class="form-control" id="contractQuery" placeholder="Mining pool 0x…" autocomplete="off" spellcheck="false">
        <button class="btn btn-accent" type="button" id="btnSearchContracts">Search</button>
      </div>
      <div id="contractHits"></div>
      <label class="form-label" for="amount">How much to unstake?</label>
      <input class="form-control" id="amount" inputmode="decimal" placeholder="0.0">
      <button type="button" class="btn btn-accent mt-3" id="btnUnstake">Request unstake</button>
      <div class="wait-card mt-3" id="waitCard">
        <div class="d-flex justify-content-between small mb-1">
          <span id="waitLabel">Wait</span>
          <span id="waitClock">—</span>
        </div>
        <div class="wait-track"><div class="wait-fill" id="waitFill"></div></div>
        <p class="small text-secondary mb-0 mt-2" id="waitHint"></p>
      </div>
      <h2 class="h6 mt-4">Open requests</h2>
      <ul id="unbondList"><li>Connect from the header to load.</li></ul>
    </div>
  </main>
  <footer class="site container-xl pb-3" id="foot"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/pins.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
