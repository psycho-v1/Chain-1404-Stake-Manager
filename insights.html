<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="Chain-1404 Stake Manager — unofficial community BDAG staking UI.">
  <title>Insights · Chain-1404 Stake Manager</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-page="insights">
  <div id="shell"></div>
  <main class="container-xl py-4">
    <div class="glass p-4 mb-3">
      <h1 class="h3">Insights</h1>
      <p class="text-secondary mb-0">Built from what this device can see: your position, local activity, community connections, and public contract splits. No off-chain analytics service.</p>
    </div>
    <div class="row g-3">
      <div class="col-lg-6"><div class="glass p-3"><h2 class="h6">Position mix</h2><canvas id="chartMix" class="chart"></canvas></div></div>
      <div class="col-lg-6"><div class="glass p-3"><h2 class="h6">Emission split on contract</h2><canvas id="chartSplit" class="chart"></canvas></div></div>
      <div class="col-lg-6"><div class="glass p-3"><h2 class="h6">Unbonding requests</h2><canvas id="chartUnbond" class="chart"></canvas></div></div>
      <div class="col-lg-6"><div class="glass p-3"><h2 class="h6">Actions on this device</h2><canvas id="chartActivity" class="chart"></canvas></div></div>
      <div class="col-lg-6"><div class="glass p-3"><h2 class="h6">Connection latency</h2><canvas id="chartRpc" class="chart"></canvas></div></div>
      <div class="col-lg-6"><div class="glass p-3"><h2 class="h6">Week clock</h2><div class="progress mb-2"><div id="epochFill" class="progress-bar"></div></div><canvas id="chartEpoch" class="chart"></canvas></div></div>
    </div>
  </main>
  <footer class="site container-xl pb-3" id="foot"></footer>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/pins.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
